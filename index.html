<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💝 Для моей любимой</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23ff6b9d" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'), auto;
      }
      #root { width: 100%; height: 100%; }

      .app-container {
        width: 100vw; height: 100vh;
        background: linear-gradient(135deg, #581c87, #831843, #881337);
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
      }
      .bg-glow {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, rgba(255,105,180,0.15) 0%, transparent 70%);
        pointer-events: none;
      }
      
      /* Кнопка управления музыкой */
      .music-button {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(251, 207, 232, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 0.5s ease-out forwards;
        cursor: pointer;
      }
      .music-button:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.1);
        border-color: rgba(251, 207, 232, 0.9);
        box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
      }
      .music-button:active {
        transform: scale(0.95);
      }
      
      .floating-hearts, .sparkles {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
      }
      .floating-heart { position: absolute; animation: floatUp linear infinite; }
      @keyframes floatUp {
        0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
        10% { opacity: 1; transform: translateY(90vh) rotate(20deg) scale(1); }
        90% { opacity: 0.8; }
        100% { transform: translateY(-10vh) rotate(360deg) scale(0.5); opacity: 0; }
      }
      .sparkle { position: absolute; animation: sparkle 2s ease-in-out infinite; }
      @keyframes sparkle {
        0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
        50% { opacity: 1; transform: scale(1) rotate(180deg); }
      }
      .content-wrapper {
        position: relative; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }
      .title {
        color: white; font-size: 2rem; margin-bottom: 2rem;
        font-family: Georgia, serif; font-style: italic;
      }
      .shimmer-text {
        background: linear-gradient(90deg, #ff6b9d, #ffa8cc, #ff6b9d, #c44569, #ff6b9d);
        background-size: 200% auto;
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 3s linear infinite;
      }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .heart-button {
        position: relative; cursor: pointer;
        background: none; border: none; outline: none; padding: 0;
        perspective: 1000px;
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><path fill="%23ff4757" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'), pointer;
      }
      .heart-button:focus { outline: none; }
      .heart-glow {
        position: absolute; inset: -20px; border-radius: 50%;
        background: rgba(236, 72, 153, 0.2); filter: blur(24px);
        transform: scale(1.5); transition: transform 0.5s;
      }
      .heart-button:hover .heart-glow { transform: scale(1.75); }
      .heart-svg {
        width: 192px; height: 192px;
        filter: drop-shadow(0 25px 25px rgba(0,0,0,0.15));
        transition: all 0.3s;
        transform-style: preserve-3d;
      }
      @media (min-width: 768px) { .heart-svg { width: 256px; height: 256px; } }
      
      .heart-pulse { 
        animation: heartbeat 1.5s ease-in-out infinite, rotate3d 4s infinite ease-in-out; 
      }
      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        10% { transform: scale(1.15); }
        20% { transform: scale(1); }
        30% { transform: scale(1.1); }
        40% { transform: scale(1); }
      }
      @keyframes rotate3d {
        0% { transform: rotateY(0deg) rotateX(0deg); }
        25% { transform: rotateY(15deg) rotateX(5deg); }
        50% { transform: rotateY(0deg) rotateX(0deg); }
        75% { transform: rotateY(-15deg) rotateX(-5deg); }
        100% { transform: rotateY(0deg) rotateX(0deg); }
      }

      .heart-open { animation: heartOpen 1s ease-in-out forwards; }
      @keyframes heartOpen {
        0% { transform: scale(1); }
        30% { transform: scale(1.3); }
        60% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(0); opacity: 0; }
      }
      .click-hint {
        position: absolute; bottom: -48px; left: 50%; transform: translateX(-50%);
        color: #fbcfe8; font-size: 0.875rem;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        white-space: nowrap;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .bottom-text { margin-top: 3rem; color: rgba(253, 164, 175, 0.6); font-size: 0.875rem; text-align: center; }
      .revealed-content {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 1rem; max-width: 32rem; margin: 0 auto;
        animation: revealContent 1.2s ease-out forwards;
      }
      @keyframes revealContent {
        0% { opacity: 0; transform: scale(0.5) rotateY(90deg); }
        50% { transform: scale(1.1) rotateY(0deg); }
        100% { opacity: 1; transform: scale(1) rotateY(0deg); }
      }
      .photo-frame { position: relative; margin-bottom: 2rem; perspective: 1000px; }
      
      .photo-container {
        border-radius: 1rem; overflow: hidden; border: 4px solid #fbcfe8;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        animation: glowPulse 2s ease-in-out infinite;
        transition: transform 0.3s ease;
        transform-style: preserve-3d;
      }
      .photo-frame:hover .photo-container {
        transform: rotateY(5deg) rotateX(5deg) scale(1.02);
      }
      
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 20px rgba(255,105,180,0.3), 0 0 40px rgba(255,105,180,0.2), 0 0 60px rgba(255,105,180,0.1); }
        50% { box-shadow: 0 0 30px rgba(255,105,180,0.5), 0 0 60px rgba(255,105,180,0.3), 0 0 90px rgba(255,105,180,0.2); }
      }
      .photo-img { width: 288px; height: 224px; object-fit: cover; display: block; }
      @media (min-width: 768px) { .photo-img { width: 384px; height: 288px; } }
      .photo-fallback {
        width: 288px; height: 224px;
        background: linear-gradient(135deg, #f472b6, #e11d48);
        display: flex; align-items: center; justify-content: center; font-size: 4rem;
      }
      @media (min-width: 768px) { .photo-fallback { width: 384px; height: 288px; } }
      
      .photo-caption {
        margin-top: 1rem;
        color: #fbcfe8;
        font-size: 0.875rem;
        font-style: italic;
        opacity: 0;
        animation: fadeInUp 1s ease-out forwards;
        animation-delay: 0.5s;
      }
      
      .deco-heart { position: absolute; font-size: 1.5rem; animation: bounce 1s infinite; }
      .deco-heart-tl { top: -16px; left: -16px; }
      .deco-heart-tr { top: -16px; right: -16px; animation-delay: 0.2s; }
      .deco-heart-bl { bottom: -16px; left: -16px; animation-delay: 0.4s; }
      .deco-heart-br { bottom: -16px; right: -16px; animation-delay: 0.6s; }
      @keyframes bounce {
        0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
        50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
      }
      .love-title {
        font-size: 2rem; font-weight: bold; margin-bottom: 1rem;
        font-family: Georgia, serif; font-style: italic;
      }
      @media (min-width: 768px) { .love-title { font-size: 2.5rem; } }
      
      /* Стили для текста (печатная машинка) */
      .love-message {
        color: #fce7f3; font-size: 1.125rem; margin-bottom: 0.75rem; line-height: 1.75;
        min-height: 1.75em; /* Чтобы текст не прыгал, пока печатается */
      }
      @media (min-width: 768px) { .love-message { font-size: 1.25rem; } }
      
      .love-message-final {
        color: #fce7f3; font-size: 1.25rem; margin-bottom: 2rem;
        font-family: Georgia, serif; font-style: italic;
        min-height: 1.75em;
      }
      @media (min-width: 768px) { .love-message-final { font-size: 1.5rem; } }
      
      .reset-button {
        margin-top: 1rem; padding: 0.75rem 1.5rem;
        background: linear-gradient(to right, #ec4899, #e11d48);
        color: white; border: none; border-radius: 9999px; font-size: 1rem;
        cursor: pointer; transition: all 0.3s;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        opacity: 0; animation: fadeInUp 0.8s ease-out forwards; animation-delay: 4s; /* Задержка, чтобы кнопка появилась после текста */
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23ffffff" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'), pointer;
      }
      .reset-button:hover {
        background: linear-gradient(to right, #db2777, #be123c);
        transform: scale(1.05);
        box-shadow: 0 10px 15px -3px rgba(236,72,153,0.5);
      }
      .reset-button:active { transform: scale(0.95); }
      
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      @media (max-width: 600px) {
        .music-button {
          width: 42px;
          height: 42px;
          top: 12px;
          right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
